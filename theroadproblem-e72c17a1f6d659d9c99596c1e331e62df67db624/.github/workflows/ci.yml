name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: theroadproblem_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/theroadproblem_ci_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/theroadproblem_ci_test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations & seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/theroadproblem_ci_test
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed:boundaries

      - name: Run isolated ingestion, road-index, and citizen regression checks
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/theroadproblem_ci_test
        run: |
          node --experimental-strip-types --test tests/real-ingestion.test.mjs tests/test-database-safety.test.mjs tests/bengaluru-road-index.test.mjs
          npm run test:real-ingestion:db
          npm run verify:isolated

      - name: Build Next.js
        run: npm run build
