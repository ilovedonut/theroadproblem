name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: theroadproblem
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations & seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/theroadproblem
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run Release Acceptance Audit (R01-R20)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/theroadproblem
        run: npm run test:release:audit

      - name: Build Next.js
        run: npm run build
